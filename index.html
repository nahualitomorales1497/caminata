        let gainNodeEstatica = null;   

        function inicializarLienzo() {
            const bounding = canvas.parentElement.getBoundingClientRect();
            canvas.width = bounding.width;
            canvas.height = bounding.height;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', inicializarLienzo);
        inicializarLienzo();

        for (let i = 0; i < numLetras; i++) {
            const div = document.createElement('div');
            div.className = 'estrella-letra';
            
            const punto = document.createElement('div');
            punto.className = 'punto';
            
            const caracter = document.createElement('div');
            caracter.className = 'caracter';
            
            div.appendChild(punto);
            div.appendChild(caracter);
            galaxia.appendChild(div);
            
            estrellasData.push({ elemento: div, texto: caracter });
        }

        const escritorSubtitulo = {
            x: window.innerWidth * 0.15, 
            y: 0,                        
            yBase: 0,
            pasoPixel: 3.5 
        };

        function reiniciarSubtitulo() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            escritorSubtitulo.x = window.innerWidth * 0.15;
            escritorSubtitulo.y = canvas.height / 2;
            escritorSubtitulo.yBase = canvas.height / 2;
        }

        function crearFiltroEstatica() {
            const tamanoBuffer = audioCtx.sampleRate * 2;
            const bufferRuido = audioCtx.createBuffer(1, tamanoBuffer, audioCtx.sampleRate);
            const salidaData = bufferRuido.getChannelData(0);
            
            for (let i = 0; i < tamanoBuffer; i++) {
                salidaData[i] = Math.random() * 2 - 1;
            }
            
            const fuenteRuido = audioCtx.createBufferSource();
            fuenteRuido.buffer = bufferRuido;
            fuenteRuido.loop = true;
            
            const filtroBajo = audioCtx.createBiquadFilter();
            filtroBajo.type = 'lowpass';
            filtroBajo.frequency.setValueAtTime(320, audioCtx.currentTime); 
            
            gainNodeEstatica = audioCtx.createGain();
            gainNodeEstatica.gain.setValueAtTime(0.02, audioCtx.currentTime); 
            
            fuenteRuido.connect(filtroBajo);
            filtroBajo.connect(gainNodeEstatica);
            gainNodeEstatica.connect(audioCtx.destination);
            
            fuenteRuido.start();
        }

        function inicializarAudio() {
            if (audioCtx) return;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            crearFiltroEstatica();
            
            gainNodeNodos = audioCtx.createGain();
            gainNodeNodos.gain.setValueAtTime(0, audioCtx.currentTime);
            
            osciladorFijo = audioCtx.createOscillator();
            osciladorFijo.type = 'sine';
            osciladorFijo.frequency.setValueAtTime(220, audioCtx.currentTime);
            
            osciladorModulador = audioCtx.createOscillator();
            osciladorModulador.type = 'triangle';
            osciladorModulador.frequency.setValueAtTime(330, audioCtx.currentTime);
            
            osciladorFijo.connect(gainNodeNodos);
            osciladorModulador.connect(gainNodeNodos);
            gainNodeNodos.connect(audioCtx.destination);
            
            osciladorFijo.start();
            osciladorModulador.start();
            
            avisoInicio.style.opacity = '0';
        }

        function mutarGalaxiaSuperior() {
            const palabraActual = palabras[Math.floor(Math.random() * totalPalabras)];
            const ancho = window.innerWidth;
            const alto = canvas.parentElement.offsetTop; 
            
            const margenX = ancho * 0.12;
            const margenY = alto * 0.15;
            
            estrellasData.forEach((estrella, j) => {
                const x = margenX + Math.random() * (ancho - (margenX * 2));
                const y = margenY + Math.random() * (alto - (margenY * 2));
                
                estrella.elemento.style.left = x + 'px';
                estrella.elemento.style.top = y + 'px';
                estrella.texto.innerText = palabraActual[j];
            });
        }

        function escribirUnPasoAsemico() {
            if (escritorSubtitulo.x > window.innerWidth * 0.85) {
                reiniciarSubtitulo();
            }

            ctx.beginPath();
            ctx.moveTo(escritorSubtitulo.x, escritorSubtitulo.y);

            escritorSubtitulo.x += escritorSubtitulo.pasoPixel;
            
            const fuerzaRetorno = (escritorSubtitulo.yBase - escritorSubtitulo.y) * 0.15;
            escritorSubtitulo.y += (Math.random() * 10 - 5) + fuerzaRetorno;

            ctx.lineTo(escritorSubtitulo.x, escritorSubtitulo.y);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.45 + Math.random() * 0.4) + ')';
            ctx.lineWidth = 1.0 + Math.random() * 0.5;
            ctx.stroke();
        }

        canvas.height = canvas.parentElement.getBoundingClientRect().height;
        escritorSubtitulo.y = canvas.height / 2;
        escritorSubtitulo.yBase = canvas.height / 2;
        mutarGalaxiaSuperior();

        let contadorMovimiento = 0;
        let lastMoveTime = Date.now();

        window.addEventListener('mousemove', (e) => {
            inicializarAudio();
            if (!audioCtx) return;
            
            const now = Date.now();
            const dt = now - lastMoveTime;
            lastMoveTime = now;
            
            const dx = e.movementX;
            const dy = e.movementY;
            const velocidad = Math.sqrt(dx * dx + dy * dy) / (dt || 1);
            
            escribirUnPasoAsemico();
            
            const proporcionX = e.clientX / window.innerWidth;
            const frecuenciaBase = 110 + (proporcionX * 380);
            osciladorFijo.frequency.setTargetAtTime(frecuenciaBase, audioCtx.currentTime, 0.1);
            osciladorModulador.frequency.setTargetAtTime(frecuenciaBase * 1.5, audioCtx.currentTime, 0.1);
            const volumenTarget = Math.min(velocidad * 0.12, 0.25);
            gainNodeNodos.gain.setTargetAtTime(volumenTarget, audioCtx.currentTime, 0.05);
            contadorMovimiento++;
            if (contadorMovimiento % 18 === 0) {
                mutarGalaxiaSuperior();
            }
        });
        
        setInterval(() => {
            const timeSinceLastMove = Date.now() - lastMoveTime;
            if (timeSinceLastMove > 100 && audioCtx && gainNodeNodos) {
                gainNodeNodos.gain.setTargetAtTime(0, audioCtx.currentTime, 0.12);
            }
        }, 50);
    </script>
</body>
</html>
